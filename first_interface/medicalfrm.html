<!DOCTYPE html>
<html lang="en">
    <style>     
        .whole{
            background-color: rgb(239, 238, 232);
            text-overflow: clip;
            font-size: large;
            line-height: 45px;
            height: 100px;
        
        }
        .form{
            background-color: rgb(28, 28, 219);
            text-align: left;
            font-size: large;
            line-break: normal;
            margin-bottom: 0px;
            padding: 0px;
            
        }
        p{
            background-color: rgb(244, 166, 32);
            height: 30px;
            text-align: left;
            margin-bottom: 5px;
            margin-top: 0%;
            padding: 0px;
            line-height: 29px;
        }

    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="whole">
    <div class="form">
        <h1 style="text-align: center;">MEDICAL FORM</h1>
        <h2 style="text-align: end;">ST.JAMES HOSPITAL</h2>
    </div>
    <p>PATIENT INFORMATION</p>
    <div class="cont1">
        <form>
            <label>
                Patient's Full Name
            </label>
            <input type="text">
            

            <label style="margin-left: 190px;">
                Date of Birth
            </label>
            <input type="date" style="width: 100px;">
            <br>
            <label>
                Email Address
            </label>
            <input type="text" >
    
            <label style="margin-left: 170px;">
                Phone number
            </label>
            <input type="int">
              
        </form>
    </div>

    
    <p>EMERGENCY CONTACT INFORMATION</p>
    <div class="cont2">
        <form>
            <label>
                Name
            </label>
            <input type="text" style="width: 220px;">
            <label style="shape-margin: 200px; width: 220px;">
                Relationship
            </label>
            <input type="text" style="margin-left: 20px;width: 220px;">
            <label>
                Phone Number
            </label>
            <input type="int" style="width: 220px;">
        </form>
    </div>
    <p>INSURANCE INFORMATION</p>
    <div class="cont3">
        <form>
            <label>
                Insurance Provider
            </label>
            <input type="text">
            <label>
                Policy number
            </label>
            <input type="int">
        </form>
    </div>

    <p>MEDICAL HISTORY</p>
    <div class="cont4">
        <label>Have you ever had any of the following conditions?(Check all that apply)</label>
        <br>
        <label>
            Diabetes
        </label>
        <input type="checkbox">
        <br>
        <label>
            Hypertension
        </label>
        <input type="checkbox">
        <br>
        <label>
            Asthma
        </label>
        <input type="checkbox">
        <br>
        <label>
            Cancer
        </label>
        <input type="checkbox">
        <br>
        <label>
            Other
        </label>
        <input type="text" style="width: 320px;">
        <br>
        <label>
            Do you have any Known allergies?if yes, please list:
        </label>
        <input type="text" style="width: 320px;"">
        <br>
        <label>
            Are you taking any medications?if yes, Please List:
        </label>
        <input type="text">
    </div>

    <div class="cont5">
        <p>PURPOSE OF VISIT</p>
        <label>
            Describe your symptoms or reason for this visit:
        </label>
        <br>
        <input type="text" style="width: 540px; height:500;">
    </div>
    </div>
</body>
</html>
